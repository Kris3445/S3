[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inazuma-eleven-manager"
version = "0.1.0"
description = "Discordowy menedżer kariery Inazuma Eleven"
requires-python = ">=3.12"
dependencies = ["discord.py>=2.4,<3", "SQLAlchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "pydantic-settings>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
